<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#2a3fd1"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff176"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0a1250" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- lightning bolt -->
  <polygon points="156,14 58,146 116,146 90,242 202,98 140,98" fill="url(#bolt)"
           stroke="#fff3b0" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- envelope resting on the bolt -->
  <g filter="url(#shadow)">
    <rect x="40" y="108" width="176" height="116" rx="16" fill="#ffffff"/>
    <path d="M48 124 L128 182 L208 124" fill="none" stroke="#3b5bdb" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
